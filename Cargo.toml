[workspace]
resolver = "3"
members = ["crates/dsp", "crates/engine", "crates/host", "crates/server", "crates/nf-engine"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
dsp = { path = "crates/dsp" }
engine = { path = "crates/engine" }
host = { path = "crates/host" }
cpal = "0.18"
rtrb = "0.4"
hound = "3.5"
# `default-features = false` drops its `disable_release`, which compiles
# `AllocDisabler` out of release builds — and rustdoc builds doctests with debug
# assertions on against a release rlib, so the type it wants is not there and
# `cargo test --release` fails to compile before running a thing. Keeping the
# type in both profiles costs nothing: `realtime` and the binaries both gate on
# `debug_assertions` themselves, so nothing installs it in a release build.
assert_no_alloc = { version = "1.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `handshake` is what provides `accept`; the TLS features are not wanted,
# since this only ever listens on localhost.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# Clippy lints worth having on an audio thread. Each crate opts in with
# `[lints] workspace = true`.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_panics_doc = "warn"

# Our code needs some optimisation even in dev or the DSP cannot keep up with
# real time; dependencies get the lot, because we never step through them.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
