<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nightflight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>nightflight</h1>
  <span id="set" class="set">connecting…</span>
  <nav id="tabs" class="tabs"></nav>
  <span class="spacer"></span>
  <span id="notice" class="notice"></span>
  <span id="device" class="weak mono"></span>
</header>

<section class="transport">
  <button id="play" title="space">play</button>
  <button id="start" title="back to the beginning">start</button>
  <input id="scrub" type="range" min="0" max="34" step="0.01" value="0">
  <span id="position" class="mono fixed"></span>
</section>

<section class="health">
  <span class="label">load</span>
  <span class="meter wide"><i id="load"></i></span>
  <span id="loadText" class="mono fixed"></span>
  <span id="voices" class="mono fixed"></span>
  <span id="peak" class="mono fixed"></span>
  <span id="dropouts" class="mono fixed"></span>
  <span class="label">bpm</span>
  <input id="bpm" type="range" min="60" max="180" step="0.5" value="126">
  <span id="bpmText" class="mono fixed"></span>
  <span class="label">master</span>
  <input id="master" type="range" min="0" max="1.5" step="0.01" value="0.5">
</section>

<div id="view-conductor" class="view">
<section class="timeline">
  <canvas id="timeline"></canvas>
</section>

<main>
  <div class="column">
    <h2>lanes</h2>
    <div id="lanes" class="lanes"></div>
  </div>
  <div class="column">
    <h2>where things are</h2>
    <canvas id="plan"></canvas>
    <h2>macros</h2>
    <div id="macros" class="macros"></div>
  </div>
</main>
</div>

<div id="view-clip" class="view hidden">
  <section class="clip-head">
    <span id="clipName" class="set"></span>
    <span id="clipInfo" class="weak mono fixed"></span>
    <span id="stage" class="stage" title="what the engine is playing"></span>
    <span class="spacer"></span>
    <span class="weak">what this clip holds · edit it with <code>nf</code></span>
  </section>
  <div class="column">
    <div id="clipLanes" class="clip"></div>
  </div>
</div>

<div id="view-library" class="view hidden">
  <section class="clip-head">
    <span class="set">library</span>
    <span id="libraryInfo" class="weak mono fixed"></span>
    <span class="spacer"></span>
    <span class="weak">everything saved under a name · a patch is an instrument, a clip is material</span>
  </section>
  <main class="three">
    <div class="column">
      <h2>pieces</h2>
      <div id="libraryPieces" class="library"></div>
    </div>
    <div class="column">
      <h2>clips</h2>
      <div id="libraryClips" class="library"></div>
    </div>
    <div class="column">
      <h2>patches</h2>
      <div id="libraryPatches" class="library"></div>
    </div>
  </main>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
